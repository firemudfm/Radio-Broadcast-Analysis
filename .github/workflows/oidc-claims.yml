name: Inspect GitHub OIDC claims

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: radio-production-oidc-claims
  cancel-in-progress: false

jobs:
  claims:
    name: Display safe OIDC claims
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Request token and display safe claims
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"
          token="$(jq -r '.value' <<<"${response}")"
          if [[ -z "${token}" || "${token}" == "null" ]]; then
            echo "GitHub did not return an OIDC token."
            exit 1
          fi
          echo "::add-mask::${token}"
          OIDC_TOKEN="${token}" python3 - <<'PY'
          import base64
          import json
          import os
          token = os.environ["OIDC_TOKEN"]
          parts = token.split(".")
          if len(parts) != 3:
              raise SystemExit("Invalid JWT structure")
          payload = parts[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          expected = {
              "iss": "https://token.actions.githubusercontent.com",
              "aud": "sts.amazonaws.com",
              "repository": "naman1995jain/Radio-Broadcast-Analysis",
              "environment": "production",
              "ref": "refs/heads/main",
          }
          for key, value in expected.items():
              if claims.get(key) != value:
                  raise SystemExit(
                      f"Unexpected {key}: {claims.get(key)!r}; "
                      f"expected {value!r}"
                  )
          subject = claims.get("sub")
          if not subject:
              raise SystemExit("OIDC subject is missing")
          safe_keys = (
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "repository_visibility",
              "environment",
              "ref",
              "ref_type",
              "workflow",
              "workflow_ref",
              "workflow_sha",
              "job_workflow_ref",
              "event_name",
              "actor",
              "actor_id",
              "runner_environment",
          )
          safe_claims = {
              key: claims.get(key)
              for key in safe_keys
              if key in claims
          }
          print(json.dumps(safe_claims, indent=2, sort_keys=True))
          PY
          unset token
          unset response
