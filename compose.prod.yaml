# Production overlay for the 8 vCPU / 16 GiB aarch64 target (c7g/c8g.2xlarge
# class). The architecture is load-bearing: the deployment toolchain pins
# aarch64 binaries and the host gate refuses anything else.
#
#   docker compose -f compose.yaml -f compose.prod.yaml --profile core --profile pipeline up -d
#
# HISTORY: this file was originally sized for a 4 vCPU / 8 GiB host and was
# deployed unchanged onto the twice-as-large pilot box. The result looked like
# three unrelated bugs but was one file: the llm cap of cpus "0.75" made a
# 0.6B model generate at 2.5 tokens/s, so every analysis timed out at 90s and
# every mention surfaced neutral with zero confidence; the transcription caps
# decoded slower than the listener captured, so the transcription queue grew
# to ~20k messages; and five host cores sat idle while both starved. The
# limits below are sized for the real host.
#
# The memory limits are a **conservative starting allocation**, not a
# benchmarked optimum. They are chosen so the sum cannot exceed the host,
# which is the property that matters: an unbounded container takes the whole
# machine down with it, and the OOM killer picks its victim by score, not by
# importance -- it is as likely to kill the API as the worker that grew.
#
#   api                    512 MiB
#   planner                256 MiB
#   listener             1 024 MiB   (ring buffers: ~1.83 MiB per station)
#   transcription-worker 3 072 MiB   (int8 model + decode)
#   analysis-worker        512 MiB
#   cleanup-worker         256 MiB
#   llm                  4 096 MiB   (sized so a ~2.5 GiB 4B-class GGUF swap
#                                    is an env change, not a limits change)
#   --------------------------------
#   total                9 728 MiB   leaving ~6 GiB for the kernel, page cache
#                                    and the SQLite WAL
#
# CPU limits deliberately overcommit the 8 vCPUs (the original file did too,
# relative to its 4 vCPU target): they are ceilings against a runaway
# container, not reservations, and the llm only bursts when a mention needs
# analysis. Thread counts match their container's CPU ceiling; more threads
# than quota just adds context-switch thrash.
#
# Re-measure with `docker stats` under real load before raising any of these;
# see docs/OPERATIONS.md.

services:

  api:
    # Loopback by DEFAULT. TLS termination and any authentication belong in a
    # reverse proxy; uvicorn is not the right thing to expose directly.
    #
    # RADIO_API_PUBLISH_HOST exists only so a restricted pilot can bind
    # 0.0.0.0 without editing this file. scripts/deploy-compose.sh refuses that
    # value unless RADIO_ALLOW_DIRECT_HTTP=1 is also set, because the API runs
    # with auth_mode=none and no TLS -- network restriction then has to come
    # from outside the container, which this repository cannot enforce.
    ports: !override
      - "${RADIO_API_PUBLISH_HOST:-127.0.0.1}:8788:8788"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      LOG_LEVEL: INFO
      RADIO_LOG_FORMAT: json

  planner:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  listener:
    deploy:
      resources:
        limits:
          memory: 1024M
          # Decoding several streams is genuinely parallel work; capture must
          # never lose to batch work, so the listener keeps a full share.
          cpus: "1.5"

  transcription-worker:
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "3.0"
    environment:
      RADIO_ASR_DEVICE: cpu
      RADIO_ASR_COMPUTE_TYPE: int8
      # Matches the CPU ceiling. Three threads on this host decode faster than
      # the listener captures, which is the property that keeps the queue near
      # zero; the listener's own ceiling protects live capture regardless.
      RADIO_ASR_CPU_THREADS: "3"

  analysis-worker:
    deploy:
      resources:
        limits:
          memory: 512M
          # Above the old 0.5: this worker now also cuts evidence clips with
          # FFmpeg, and starving that only delays audio, never capture.
          cpus: "0.75"

  cleanup-worker:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  llm:
    deploy:
      resources:
        limits:
          memory: 4096M
          # THE incident line. This was "0.75" from the 4 vCPU sizing: a 0.6B
          # model under that cap generated 2.5 tokens/s, every request hit the
          # 90s timeout at ~200 of 480 tokens, and every mention fell back to
          # neutral. Three cores decode a 0.6B at interactive speed and keep a
          # future 4B-class model inside the request timeout.
          cpus: "3.0"
    environment:
      # Matches the CPU ceiling; four threads inside a three-core quota only
      # add context-switch thrash.
      RADIO_LLM_THREADS: "3"
